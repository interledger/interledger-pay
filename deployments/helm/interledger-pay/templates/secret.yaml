{{- if and .Values.app.enabled (not .Values.secretsExternal) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "interledger-pay.secretName" . }}
  {{- include "common.metadata" (list . .Values.app) | nindent 2 }}
type: Opaque
stringData:
  secrets.yaml: |
    {{- toYaml .Values.secret | nindent 4 }}
{{- end }}
