{{- define "interledger-pay.deployment" -}}
{{- $top := first . }}
spec:
  template:
    metadata:
      annotations:
        interledger-pay-config-sha256: {{ $top.Values.config | toJson | sha256sum | quote }}
        {{- if not $top.Values.secretsExternal }}
        interledger-pay-secret-sha256: {{ $top.Values.secret | toJson | sha256sum | quote }}
        {{- end }}
{{- end }}
{{- if .Values.app.enabled }}
{{- $app := deepCopy .Values.app }}
{{- $port := "" }}
{{- range .Values.app.ports }}
{{- if eq .name "http" }}{{ $port = toString .containerPort }}{{ end }}
{{- end }}
{{- if not $port }}{{ fail "app.ports must contain a port named http" }}{{ end }}
{{- $env := list
  (dict "name" "NODE_ENV" "value" "production")
  (dict "name" "PORT" "value" $port)
  (dict "name" "CONFIG_FILE" "value" "/etc/interledger-pay/config/config.yaml")
  (dict "name" "SECRETS_FILE" "value" "/etc/interledger-pay/secrets/secrets.yaml")
}}
{{- $_ := set $app "env" (concat $env (.Values.app.env | default list)) }}
{{- $volumeMounts := list
  (dict "name" "config" "mountPath" "/etc/interledger-pay/config" "readOnly" true)
  (dict "name" "secrets" "mountPath" "/etc/interledger-pay/secrets" "readOnly" true)
}}
{{- $_ := set $app "volumeMounts" (concat $volumeMounts (.Values.app.volumeMounts | default list)) }}
{{- $volumes := list
  (dict "name" "config" "configMap" (dict "name" (include "interledger-pay.configMapName" .)))
  (dict "name" "secrets" "secret" (dict "secretName" (include "interledger-pay.secretName" .)))
}}
{{- $_ := set $app "volumes" (concat $volumes (.Values.app.volumes | default list)) }}
{{- include "common.deployment" (list . $app .Values.app.autoscaling .Values.app.serviceAccount "interledger-pay.deployment") }}
{{- end }}
