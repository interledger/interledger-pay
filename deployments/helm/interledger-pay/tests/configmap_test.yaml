suite: interledger-pay - configmap
templates:
  - configmap.yaml
values:
  - ../ci/minimal-values.yaml
tests:
  - it: holds the config file
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-interledger-pay-config
      - equal:
          path: data["config.yaml"]
          value: |
            host: https://pay.example.com
            stripe:
              publishableKey: pk_test_abc
            walletAddress:
              keyId: key-1
              url: https://ilp.example.com/pay

  - it: keeps an explicit redirectUrl
    set:
      config.redirectUrl: https://other.example.com/done
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^redirectUrl: https://other.example.com/done$'

  - it: leaves an empty redirectUrl out
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: redirectUrl

  - it: rejects a key that is not a setting
    set:
      config.interledgerPayHost: https://pay.example.com
    asserts:
      - failedTemplate:
          errorPattern: config.interledgerPayHost is not a known key

  - it: rejects a secret in config
    set:
      config.walletAddress.privateKey: abc
    asserts:
      - failedTemplate:
          errorPattern: config.walletAddress.privateKey is not a known key

  - it: requires the host
    set:
      config.host: ''
    asserts:
      - failedTemplate:
          errorMessage: config.host is required

  - it: rejects a host with a path
    set:
      config.host: https://pay.example.com/pay
    asserts:
      - failedTemplate:
          errorPattern: config.host must be an https origin without a path

  - it: rejects an http wallet address
    set:
      config.walletAddress.url: http://ilp.example.com/pay
    asserts:
      - failedTemplate:
          errorPattern: config.walletAddress.url must be an https URL

  - it: rejects a Stripe secret key as publishable key
    set:
      config.stripe.publishableKey: sk_test_abc
    asserts:
      - failedTemplate:
          errorPattern: config.stripe.publishableKey must be a Stripe publishable key
