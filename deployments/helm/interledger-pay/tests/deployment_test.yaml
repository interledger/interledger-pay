suite: interledger-pay - deployment
templates:
  - deployment.yaml
values:
  - ../ci/minimal-values.yaml
tests:
  - it: mounts the config and secrets files
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - { name: PORT, value: '3000' }
            - { name: CONFIG_FILE, value: /etc/interledger-pay/config/config.yaml }
            - { name: SECRETS_FILE, value: /etc/interledger-pay/secrets/secrets.yaml }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: config, mountPath: /etc/interledger-pay/config, readOnly: true }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: secrets, mountPath: /etc/interledger-pay/secrets, readOnly: true }
      - contains:
          path: spec.template.spec.volumes
          content: { name: config, configMap: { name: RELEASE-NAME-interledger-pay-config } }
      - contains:
          path: spec.template.spec.volumes
          content: { name: secrets, secret: { secretName: RELEASE-NAME-interledger-pay-secret } }
      - exists:
          path: spec.template.metadata.annotations.interledger-pay-config-sha256
      - exists:
          path: spec.template.metadata.annotations.interledger-pay-secret-sha256

  - it: appends app.env, app.volumeMounts and app.volumes
    set:
      app.env:
        - name: EXTRA
          value: '1'
      app.volumeMounts:
        - name: extra
          mountPath: /extra
      app.volumes:
        - name: extra
          emptyDir: {}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value: { name: EXTRA, value: '1' }
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2]
          value: { name: extra, mountPath: /extra }
      - equal:
          path: spec.template.spec.volumes[2]
          value: { name: extra, emptyDir: {} }

  - it: mounts secretsExternal
    set:
      secretsExternal: pay-secrets
      secret: null
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: secrets, secret: { secretName: pay-secrets } }
      - notExists:
          path: spec.template.metadata.annotations.interledger-pay-secret-sha256

  - it: runs the image of the chart's appVersion
    chart:
      appVersion: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/interledger/interledger-pay:v1.2.3

  - it: probes /health
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health

  - it: renders nothing when disabled
    set:
      app.enabled: false
    asserts:
      - hasDocuments:
          count: 0
