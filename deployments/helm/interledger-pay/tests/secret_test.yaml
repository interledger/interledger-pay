suite: interledger-pay - secret
templates:
  - secret.yaml
values:
  - ../ci/minimal-values.yaml
tests:
  - it: holds the secrets file
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-interledger-pay-secret
      - equal:
          path: stringData["secrets.yaml"]
          value: |
            session:
              cookieSecret: 0123456789abcdef0123456789abcdef
            stripe:
              secretKey: sk_test_abc
            walletAddress:
              privateKey: cHJpdmF0ZS1rZXk=

  - it: is not created with secretsExternal
    set:
      secretsExternal: pay-secrets
      secret: null
    asserts:
      - hasDocuments:
          count: 0
