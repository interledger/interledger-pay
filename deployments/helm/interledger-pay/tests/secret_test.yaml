suite: interledger-pay - secret
templates:
  - secret.yaml
values:
  - ../ci/minimal-values.yaml
tests:
  - it: holds the keys of secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-interledger-pay-secret
      - equal:
          path: stringData
          value:
            key.privateKey: cHJpdmF0ZS1rZXk=
            sessionCookieKey: 0123456789abcdef0123456789abcdef
            stripe.secretKey: sk_test_abc

  - it: is not created with secretsExternal
    set:
      secretsExternal: pay-secrets
      secret:
        key.privateKey: ''
        sessionCookieKey: ''
        stripe.secretKey: ''
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects an unknown key
    set:
      secret.other: x
    asserts:
      - failedTemplate:
          errorPattern: secret.other is not a known key
