# The config file of Interledger Pay, held in a ConfigMap. Interledger Pay
# validates it, and the secrets file, when it starts and does not start if
# either is not valid.
config:
  # Public URL of Interledger Pay, an origin without a path.
  host: ""
  # Where the identity provider returns the user after an interaction.
  # Defaults to <host>/finish.
  # redirectUrl: ""
  # The wallet address Interledger Pay signs its Open Payments requests as.
  walletAddress:
    url: ""
    keyId: ""
  stripe:
    publishableKey: ""

# Name of an existing Secret to mount instead of the one the chart creates. It
# must hold the secrets file under a `secrets.yaml` key; `secret` is then
# ignored.
secretsExternal: ""
# The secrets file of Interledger Pay, held in a Secret.
secret:
  walletAddress:
    # Ed25519 private key (PEM, or base64 encoded PEM) of
    # config.walletAddress.keyId.
    privateKey: ""
  session:
    # Signs the session cookie. At least 32 characters.
    cookieSecret: ""
  stripe:
    secretKey: ""

app:
  name: ""
  enabled: true
  replicaCount: 1
  # No tag: it defaults to the chart's appVersion.
  image:
    repository: ghcr.io/interledger
    name: interledger-pay
  imagePullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 3000
      protocol: TCP
  service:
    name: service
    type: ClusterIP
    ports:
      - name: http
        port: 80
        targetPort: http
        protocol: TCP
    annotations: {}
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    httpGet:
      path: /health
      port: http
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    httpGet:
      path: /health
      port: http
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Added after PORT, CONFIG_FILE and SECRETS_FILE.
  env: []
  # Added after the config and secrets mounts.
  volumeMounts: []
  volumes: []
  serviceAccount: {}
  autoscaling: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

securityContext:
  capabilities:
    drop:
      - ALL
  runAsUser: 1337
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

podSecurityContext:
  fsGroup: 1337
  seccompProfile:
    type: RuntimeDefault
